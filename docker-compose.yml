# docker-compose.yml
version: "3"
services:
  nginx:
    image: nginx:1.17.8-alpine
    ports:
      - 8080:80
    volumes:
      - .:/app
      - ./var/log/nginx:/var/log/nginx
      - .conf/nginx/site.conf:/etc/nginx/conf.d/default.conf
  fpm:
    image: php:8.3-fpm
    restart: always
    volumes:
      - .:/app
  phpunit:
    image: php:8.3-cli
    restart: never
    volumes:
      - .:/app
    working_dir: /app
    entrypoint: vendor/bin/phpunit
  php:
    image: php:8.3-cli
    restart: never
    volumes:
      - .:/app
    working_dir: /app
  composer:
    image: composer:2.5.8
    environment:
      - COMPOSER_CACHE_DIR=/app/var/cache/composer
    volumes:
      - .:/app
    restart: never
